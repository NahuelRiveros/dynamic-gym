# ─────────────────────────────────────────────────────────────────
#  render.yaml — Infraestructura de Dynamic Gym en Render.com
#
#  ARQUITECTURA:
#    Frontend → Vercel  (https://dynamic-gym.vercel.app)
#    Backend  → Render  (este archivo)
#
#  Docs: https://render.com/docs/infrastructure-as-code
# ─────────────────────────────────────────────────────────────────

services:
  # ── API (solo backend, el front está en Vercel) ────────────────
  - type: web
    name: dynamic-gym-api
    env: node
    region: oregon

    # Solo instalamos las dependencias del servidor.
    # El frontend ya está deployado en Vercel, no se construye acá.
    buildCommand: cd servidor && npm ci

    startCommand: cd servidor && npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: DB_SSL
        value: "true"

      # Render genera un valor seguro automáticamente la primera vez.
      # Podés rotarlo desde el panel de Render → Environment.
      - key: JWT_SECRET
        generateValue: true

      # Render conecta la base de datos de abajo automáticamente.
      - key: DATABASE_URL
        fromDatabase:
          name: dynamic-gym-db
          property: connectionString

      # ⚠️ IMPORTANTE: dominio de Vercel para que CORS funcione.
      # Frontend: https://dynamic-gym.vercel.app
      # Backend:  https://dynamic-gym.onrender.com
      - key: CORS_ORIGIN
        value: "https://dynamic-gym.vercel.app"

# ── Base de datos PostgreSQL ───────────────────────────────────
databases:
  - name: dynamic-gym-db
    databaseName: dynamicgym
    user: dynamicgym_user
    region: oregon
